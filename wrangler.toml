name = "blamenick"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Everything in public/ is served as-is. Requests that don't match a file
# (the /api routes) go to src/index.js.
[assets]
directory = "public"
binding = "ASSETS"

# Visitor counter for the "Nick popularity" chart.
[[d1_databases]]
binding = "DB"
database_name = "blamenick"
database_id = "3f185fb2-8a75-4698-b5a3-f7fae10ec9dd"
